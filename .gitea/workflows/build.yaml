name: build

on:
  push:
    branches:
      - master

jobs:
  build:
    runs-on: node22
    # Only run when TARGET_BRANCH is unset, or the current branch matches it.
    # When this condition is false the job is *skipped* (not failed), so no
    # failure notification is sent.
    if: ${{ vars.TARGET_BRANCH == '' || github.ref == format('refs/heads/{0}', vars.TARGET_BRANCH) }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install pnpm
        run: npm i -g pnpm

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        # /pnpm-store is a persistent volume mounted by the runner; reusing it
        # avoids re-downloading all packages on every run
        run: pnpm i --store-dir=/pnpm-store

      - name: Build project
        run: pnpm build
        env:
          CLOUDFLARE_D1_TOKEN: ${{ secrets.CLOUDFLARE_D1_TOKEN }}
          CLOUDFLARE_D1_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_D1_ACCOUNT_ID }}
          CLOUDFLARE_D1_DATABASE_ID: ${{ secrets.CLOUDFLARE_D1_DATABASE_ID }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          # use the host daemon's built-in BuildKit instead of a throwaway
          # docker-container builder: base images resolve from the local image
          # store (no Docker Hub access) and layer cache persists across runs
          driver: docker

      - name: Build and load Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          load: true
          tags: nuxt3-blog:${{ github.sha }}

  deploy:
    runs-on: runner-host
    needs: build
    steps:
      - name: Deploy Docker container
        env:
          IMAGE: nuxt3-blog:${{ github.sha }}
          CONTAINER: nuxt3-blog-app
          CLOUDFLARE_D1_TOKEN: ${{ secrets.CLOUDFLARE_D1_TOKEN }}
          CLOUDFLARE_D1_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_D1_ACCOUNT_ID }}
          CLOUDFLARE_D1_DATABASE_ID: ${{ secrets.CLOUDFLARE_D1_DATABASE_ID }}
        run: |
          set -eu
          docker image inspect "$IMAGE" >/dev/null
          docker rm -f "$CONTAINER" 2>/dev/null || true
          docker run -d \
            --name "$CONTAINER" \
            --restart always \
            --pull never \
            -e CLOUDFLARE_D1_TOKEN \
            -e CLOUDFLARE_D1_ACCOUNT_ID \
            -e CLOUDFLARE_D1_DATABASE_ID \
            -p 127.0.0.1:8451:3000 \
            "$IMAGE"
