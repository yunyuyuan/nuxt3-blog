name: Check
on:
  pull_request:
  push:
    branches: ["master"]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check:
    # Forks deploy from their own branches and commit content from /manage;
    # only run the full check in the upstream repository.
    if: ${{ github.repository == 'yunyuyuan/nuxt3-blog' }}
    # Pinned: ubuntu-latest is migrating to 26.04, which Playwright 1.54 does not support.
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Prepare Nuxt
        # eslint.config.mjs imports .nuxt/eslint.config.mjs, which nuxi prepare generates.
        run: pnpm exec nuxi prepare
      - name: Lint
        run: pnpm exec eslint . --max-warnings 0
      - name: Typecheck
        run: pnpm typecheck
      - name: Unit tests
        run: pnpm test:unit
      - name: Build
        run: pnpm build
        env:
          NB_PRERENDER_STRICT: "true"
      - name: Check static output
        run: test -f .output/public/404.html
  e2e:
    if: ${{ github.repository == 'yunyuyuan/nuxt3-blog' }}
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium
      - name: Build for e2e
        run: pnpm build-for-test
      - name: E2E tests
        run: pnpm test:prod-and-e2e
